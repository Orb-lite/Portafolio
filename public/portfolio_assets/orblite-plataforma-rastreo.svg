<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768" width="1366" height="768" style="background:#071026;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <!-- Top Bar -->
  <rect x="0" y="0" width="1366" height="68" fill="#06122d" stroke="#16274e" stroke-width="1"/>
  
  <!-- Logo ORB-LITE -->
  <g transform="translate(24, 12)">
    <circle cx="20" cy="20" r="14" fill="none" stroke="#22c55e" stroke-width="3"/>
    <circle cx="20" cy="20" r="8" fill="#22c55e"/>
    <path d="M 6 20 A 14 14 0 0 1 34 20" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="44" y="24" fill="#ffffff" font-size="20" font-weight="900" letter-spacing="1.5">ORB-LITE</text>
    <text x="44" y="36" fill="#38bdf8" font-size="9" font-weight="600" letter-spacing="0.5">klifnetlite • ORB-LITE (Wialon Lite)</text>
  </g>

  <!-- Title -->
  <text x="210" y="38" fill="#ffffff" font-size="20" font-weight="900" letter-spacing="1">PLATAFORMA DE RASTREO</text>

  <!-- Right Header Actions -->
  <g transform="translate(930, 16)">
    <!-- Swarm APIs pill -->
    <rect x="0" y="0" width="130" height="34" rx="6" fill="#0a1e3f" stroke="#1e3a6e" stroke-width="1"/>
    <circle cx="112" cy="17" r="3.5" fill="#22c55e"/>
    <text x="14" y="22" fill="#38bdf8" font-size="11" font-weight="700">&gt;_ Swarm APIs</text>

    <!-- User Account -->
    <rect x="140" y="0" width="130" height="34" rx="6" fill="#0a1e3f" stroke="#1e3a6e" stroke-width="1"/>
    <text x="156" y="22" fill="#cbd5e1" font-size="12" font-weight="600">👤 Mi Cuenta ▾</text>

    <!-- Logout -->
    <rect x="280" y="0" width="90" height="34" rx="6" fill="#0a1e3f" stroke="#1e3a6e" stroke-width="1"/>
    <text x="296" y="22" fill="#94a3b8" font-size="12" font-weight="600">→ Salir</text>
  </g>

  <!-- Navigation Menu Bar -->
  <rect x="0" y="68" width="1366" height="48" fill="#071536" stroke="#16274e" stroke-width="1"/>
  <g transform="translate(24, 78)" font-size="12" font-weight="700">
    <text x="10" y="22" fill="#94a3b8">MAPA</text>
    <text x="75" y="22" fill="#94a3b8">GEOCERCAS</text>
    
    <!-- Active RUTAS tab -->
    <rect x="180" y="2" width="80" height="32" rx="6" fill="#092938" stroke="#22c55e" stroke-width="1.5"/>
    <text x="198" y="22" fill="#86efac">RUTAS</text>
    
    <text x="285" y="22" fill="#94a3b8">COMPARTIR</text>
    <text x="390" y="22" fill="#94a3b8">UNIDADES</text>
    <text x="480" y="22" fill="#94a3b8">HISTORIAL</text>
    <text x="575" y="22" fill="#94a3b8">REPORTES</text>
    <text x="670" y="22" fill="#94a3b8">CÁMARAS</text>
    <text x="765" y="22" fill="#94a3b8">ALTAS (CMS)</text>
    <text x="880" y="22" fill="#94a3b8">SWARM APIS</text>
  </g>

  <!-- Subbar: Rutas Por Cliente / Recurso -->
  <rect x="24" y="132" width="1318" height="64" rx="10" fill="#0a1a3b" stroke="#1a3260" stroke-width="1"/>
  <g transform="translate(42, 146)">
    <rect x="0" y="4" width="30" height="30" rx="6" fill="#063726"/>
    <text x="8" y="24" fill="#22c55e" font-size="14">🏢</text>
    <text x="42" y="18" fill="#ffffff" font-size="13" font-weight="800">RUTAS POR CLIENTE / RECURSO</text>
    <text x="42" y="32" fill="#94a3b8" font-size="11">15 recursos disponibles en Wialon</text>
  </g>
  <g transform="translate(930, 148)">
    <rect x="0" y="0" width="230" height="32" rx="6" fill="#091b3d" stroke="#1d3d75" stroke-width="1"/>
    <text x="12" y="21" fill="#cbd5e1" font-size="11" font-weight="600">🌐 Todos los clientes (0 rutas) ▾</text>
    
    <rect x="242" y="0" width="120" height="32" rx="6" fill="#091b3d" stroke="#1d3d75" stroke-width="1"/>
    <text x="254" y="21" fill="#cbd5e1" font-size="11" font-weight="600">🔄 Sincronizar</text>
  </g>

  <!-- Main Content Area: Map (Left) + Smart Planner (Right) -->
  
  <!-- Map Container -->
  <g transform="translate(24, 212)">
    <rect x="0" y="0" width="870" height="532" rx="10" fill="#131d2e" stroke="#1e345b" stroke-width="1"/>
    
    <!-- Map Sub-header -->
    <rect x="0" y="0" width="870" height="42" rx="10" fill="#0b1730" stroke="#1a2f55" stroke-width="1"/>
    <text x="16" y="26" fill="#cbd5e1" font-size="11" font-weight="600">Mostrando 0 rutas • 30 unidades satelitales  <tspan fill="#22c55e">✓ Ver unidades</tspan></text>
    
    <rect x="420" y="8" width="220" height="26" rx="5" fill="#0f2244" stroke="#1f4277" stroke-width="1"/>
    <text x="432" y="25" fill="#cbd5e1" font-size="11">🎯 Centrar en unidad... ▾</text>

    <!-- Map Search Box Overlay -->
    <rect x="16" y="56" width="240" height="34" rx="6" fill="#07152f" stroke="#1e3b6d" stroke-width="1"/>
    <text x="28" y="78" fill="#64748b" font-size="11">🔍 Buscar dirección, lugar o co</text>
    <rect x="216" y="60" width="34" height="26" rx="4" fill="#22c55e"/>
    <text x="228" y="77" fill="#052e16" font-size="11" font-weight="800">Ir</text>

    <!-- Zoom Controls -->
    <g transform="translate(822, 56)">
      <rect x="0" y="0" width="32" height="60" rx="4" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))"/>
      <line x1="0" y1="30" x2="32" y2="30" stroke="#e2e8f0" stroke-width="1"/>
      <text x="11" y="21" fill="#0f172a" font-size="18" font-weight="900">+</text>
      <text x="12" y="49" fill="#0f172a" font-size="18" font-weight="900">−</text>
    </g>

    <!-- Map Graphic: Coastlines & Telemetry Markers -->
    <!-- Stylized North America / Mexico / US Map Silhouette -->
    <path d="M 40 180 Q 180 160 380 180 T 680 160 Q 760 220 720 340 T 540 420 Q 420 480 340 500 T 260 440 Q 180 380 140 280 Z" fill="#1b283d" opacity="0.6"/>
    <path d="M 220 340 Q 340 330 440 370 Q 480 430 380 480 Q 280 440 220 340 Z" fill="#22334d" stroke="#334b70" stroke-width="1.2"/>

    <!-- Map Cities & Borders -->
    <text x="180" y="240" fill="#94a3b8" font-size="11" font-weight="600">San Francisco</text>
    <text x="80" y="290" fill="#94a3b8" font-size="11" font-weight="600">Los Angeles</text>
    <text x="320" y="320" fill="#64748b" font-size="10">Dallas</text>
    <text x="330" y="360" fill="#64748b" font-size="10">Houston</text>
    <text x="278" y="420" fill="#e2e8f0" font-size="11" font-weight="700">Monterrey</text>
    <text x="250" y="480" fill="#38bdf8" font-size="12" font-weight="800">Guadalajara</text>
    <text x="280" y="490" fill="#e2e8f0" font-size="11" font-weight="700">Mexico City</text>
    <text x="475" y="415" fill="#64748b" font-size="10">Miami</text>
    <text x="450" y="450" fill="#64748b" font-size="10">Havana, CUBA</text>

    <!-- Telemetry GPS Units with Pulse Rings -->
    <g transform="translate(300, 395)">
      <circle cx="0" cy="0" r="14" fill="#22c55e" opacity="0.2"/>
      <circle cx="0" cy="0" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
      <polygon points="-3,-2 3,-2 0,4" fill="#ffffff"/>
    </g>

    <g transform="translate(265, 475)">
      <circle cx="0" cy="0" r="14" fill="#38bdf8" opacity="0.25"/>
      <circle cx="0" cy="0" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <g transform="translate(315, 485)">
      <circle cx="0" cy="0" r="12" fill="#22c55e" opacity="0.2"/>
      <circle cx="0" cy="0" r="6" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <g transform="translate(230, 420)">
      <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    </g>
    <g transform="translate(390, 465)">
      <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    </g>

    <!-- Map Attribution Footer -->
    <rect x="520" y="506" width="340" height="20" rx="3" fill="#ffffff" opacity="0.9"/>
    <text x="528" y="520" fill="#0f172a" font-size="10" font-weight="500">🇺🇦 Leaflet | Tiles © Esri — Esri, DeLorme, NAVTEQ</text>
  </g>

  <!-- Right Panel: Planificador Inteligente (Smart Route Planner) -->
  <g transform="translate(914, 212)">
    <rect x="0" y="0" width="428" height="532" rx="10" fill="#0d1b38" stroke="#1d3969" stroke-width="1"/>
    
    <!-- Method Selector -->
    <text x="24" y="32" fill="#94a3b8" font-size="11" font-weight="800" letter-spacing="1">MÉTODO DE CREACIÓN</text>
    
    <!-- Tab Direcciones escritas (active) -->
    <rect x="24" y="44" width="180" height="38" rx="6" fill="#08291a" stroke="#22c55e" stroke-width="1.5"/>
    <text x="44" y="68" fill="#86efac" font-size="12" font-weight="700">Direcciones escritas</text>
    
    <!-- Tab Puntos en mapa -->
    <rect x="216" y="44" width="180" height="38" rx="6" fill="#0c1e40" stroke="#1c3b70" stroke-width="1"/>
    <text x="248" y="68" fill="#94a3b8" font-size="12" font-weight="600">Puntos en mapa</text>

    <!-- Separator -->
    <line x1="24" y1="102" x2="400" y2="102" stroke="#1b325c" stroke-width="1"/>

    <!-- Section Title: Planificador Inteligente -->
    <g transform="translate(24, 126)">
      <text x="0" y="0" fill="#22c55e" font-size="15">✈</text>
      <text x="22" y="0" fill="#ffffff" font-size="13" font-weight="800" letter-spacing="0.5">PLANIFICADOR INTELIGENTE</text>
    </g>

    <!-- Input: Punto de salida -->
    <g transform="translate(24, 154)">
      <text x="0" y="0" fill="#94a3b8" font-size="11" font-weight="700">Punto de salida</text>
      <rect x="0" y="8" width="376" height="38" rx="6" fill="#08142b" stroke="#1c3a6b" stroke-width="1"/>
      <text x="14" y="32" fill="#64748b" font-size="11">Ej. Av. Vallarta 1000, Guadalajara o coordenadas (20...</text>
    </g>

    <!-- Input: Direcciones de destino -->
    <g transform="translate(24, 226)">
      <text x="0" y="0" fill="#94a3b8" font-size="11" font-weight="700">Direcciones de destino</text>
      <text x="320" y="0" fill="#22c55e" font-size="11" font-weight="700">+ Agregar</text>
      
      <!-- Stop #1 item -->
      <g transform="translate(0, 10)">
        <circle cx="8" cy="20" r="8" fill="#1e345b"/>
        <text x="5" y="24" fill="#94a3b8" font-size="10" font-weight="700">1</text>
        <rect x="24" y="0" width="318" height="38" rx="6" fill="#08142b" stroke="#1c3a6b" stroke-width="1"/>
        <text x="36" y="24" fill="#64748b" font-size="11">Dirección 1, lugar o link Google Maps</text>
        <text x="352" y="24" fill="#64748b" font-size="14">🗑</text>
      </g>
    </g>

    <!-- Ubicar puntos en el mapa button -->
    <g transform="translate(24, 304)">
      <rect x="0" y="0" width="376" height="42" rx="8" fill="#0a1d3d" stroke="#1d427d" stroke-width="1"/>
      <text x="110" y="26" fill="#cbd5e1" font-size="12" font-weight="700">Ubicar puntos en el mapa</text>
    </g>

    <!-- Checkbox: Regresar al punto de origen -->
    <g transform="translate(24, 370)">
      <rect x="0" y="0" width="16" height="16" rx="4" fill="#2563eb"/>
      <text x="3" y="13" fill="#ffffff" font-size="12" font-weight="900">✓</text>
      <text x="24" y="13" fill="#cbd5e1" font-size="11">Regresar al punto de origen al finalizar la ruta</text>
    </g>

    <!-- Primary Action: Optimizar y calcular ruta por calles -->
    <g transform="translate(24, 400)">
      <rect x="0" y="0" width="376" height="46" rx="8" fill="#84cc16"/>
      <text x="86" y="28" fill="#143400" font-size="13" font-weight="900" letter-spacing="0.3">Optimizar y calcular ruta por calles</text>
    </g>
  </g>
</svg>